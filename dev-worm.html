<style>body{margin:0}canvas{width:100vw;height:100vh;display:block}</style></head><body><canvas id=c></canvas>
<script type="module">
import * as THREE from 'three'; import { Engine } from './src/engine.js'; import { createWorm } from './src/worm.js';
