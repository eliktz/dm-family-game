<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b1a10">
<title>מאסטרים של דרקונים – וורם ודרייק</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="lib/fonts.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<section id="title" class="screen">
  <div class="title-card">
    <div class="kicker">הרפתקה משפחתית</div>
    <h1>מאסטרים<br>של דרקונים</h1>
    <h2>דרייק ווורם</h2>
    <button id="btn-start" class="big pulse">▶ פרק 1: אבן הדרקון</button>
    <div class="chapters">
      <div class="chapter locked">🔒 פרק 2 – בקרוב</div>
    </div>
    <p class="hint">גע בוורם כדי להגיד לו שלום 👋</p>
  </div>
</section>

<div id="hud" hidden>
  <div id="topbar">
    <button id="btn-home" class="round" aria-label="בית">🏠</button>
    <button id="btn-sound" class="round" aria-label="צליל">🔊</button>
    <button id="btn-voice" class="round" aria-label="הקראה">🗣️</button>
    <div id="counter" hidden><span class="star">⭐</span> <span dir="ltr" id="count">0 / 8</span></div>
  </div>
  <div id="dialog" hidden>
    <div class="who"><span class="face"></span><span class="name"></span></div>
    <div class="text"></div>
    <button class="next">המשך ◀</button>
  </div>
  <div id="toast" hidden><span class="face"></span><span class="text"></span></div>
  <div id="actions"></div>
  <div id="joy" hidden><div id="knob"></div></div>
  <div id="arrow" hidden><svg viewBox="0 0 80 80" width="80" height="80"><path d="M10 26 H46 V10 L74 40 L46 70 V54 H10 Z" fill="#ffd34a" stroke="#8a5208" stroke-width="5" stroke-linejoin="round"/></svg></div>
</div>

<section id="math" class="screen" hidden>
  <div class="panel">
    <div class="m-title">🔮 חידת השער</div>
    <div class="m-q">כמה זה <span dir="ltr" class="eq"></span>?</div>
    <div class="m-visual" dir="ltr"></div>
    <div class="m-answers" dir="ltr"></div>
    <div class="m-hint"></div>
  </div>
</section>

<section id="card" class="screen" hidden>
  <div class="panel center">
    <div class="c-kicker"></div>
    <div class="c-title"></div>
    <div class="c-text"></div>
    <div class="c-buttons"></div>
  </div>
</section>

<div id="fade"></div>
<div id="loading"><div class="egg">🥚</div><div>טוען את מערת הדרקונים…</div></div>
<div id="rotate">🔄<br>סובבו את המסך לרוחב</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
