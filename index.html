<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="דרקונים">
<meta name="theme-color" content="#2b1a10">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<title>מאסטרים של דרקונים – וורם ודרייק</title>
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="lib/fonts.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<section id="title" class="screen">
  <div class="title-card">
    <div class="kicker">הרפתקה משפחתית</div>
    <h1 id="title-h1">מאסטרים<br> של דרקונים</h1>
    <h2>דרייק ווורם</h2>
    <button id="btn-continue" class="big pulse">▶ מתחילים!</button>
    <div class="chapters" id="chapters"></div>
    <p class="hint">גע בוורם כדי להגיד לו שלום 👋</p>
  </div>
  <div id="title-toast" hidden></div>
  <div id="a2hs" hidden>
    <span class="a-text">📲 רוצים מסך מלא? הקישו על <b>שיתוף</b> <span class="a-ic">⬆️</span> ואז על <b>״הוסף למסך הבית״</b></span>
    <button id="a2hs-close" aria-label="סגירה">✕</button>
  </div>
</section>

<div id="hud" hidden>
  <div id="topbar">
    <button id="btn-home" class="round" aria-label="בית">🏠</button>
    <button id="btn-sound" class="round" aria-label="צליל">🔊</button>
    <button id="btn-skip" class="round" aria-label="דלג" hidden>⏭</button>
    <div id="counter" hidden><span class="star">⭐</span> <span dir="ltr" id="count">0 / 8</span></div>
  </div>
  <div id="dialog" hidden>
    <div class="who"><span class="face"></span><span class="name"></span></div>
    <div class="text"></div>
    <button class="next">המשך ◀</button>
  </div>
  <div id="toast" hidden><span class="face"></span><span class="text"></span></div>
  <div id="actions"></div>
  <div id="joy" hidden><div id="knob"></div></div>
  <div id="arrow" hidden><svg viewBox="0 0 80 80" width="80" height="80"><path d="M10 26 H46 V10 L74 40 L46 70 V54 H10 Z" fill="#ffd34a" stroke="#8a5208" stroke-width="5" stroke-linejoin="round"/></svg></div>
</div>

<section id="math" class="screen" hidden>
  <div class="panel">
    <div class="m-title"></div>
    <div class="m-q"></div>
    <div class="m-visual" dir="ltr"></div>
    <div class="m-steps" dir="ltr" hidden></div>
    <div class="m-answers" dir="ltr"></div>
    <div class="m-hint"></div>
  </div>
</section>

<section id="parent" class="screen" hidden>
  <div class="panel">
    <div class="p-title">מצב הורים</div>
    <div class="p-row"><span class="p-label">חידות: רמת התחלה</span><div id="p-levels" class="p-levels" dir="ltr"></div></div>
    <div class="p-row"><span class="p-label">חידות: רמה מקסימלית</span><div id="p-ceil" class="p-levels" dir="ltr"></div></div>
    <div class="p-example" id="p-example"></div>
    <div class="p-row"><button id="p-auto" class="p-toggle"></button><button id="p-all" class="p-toggle"></button></div>
    <div class="p-row"><button id="p-reset" class="p-toggle danger"></button><button id="p-close" class="big green">סגירה ✓</button></div>
  </div>
</section>

<section id="card" class="screen" hidden>
  <div class="panel center">
    <div class="c-kicker"></div>
    <div class="c-title"></div>
    <div class="c-text"></div>
    <div class="c-buttons"></div>
  </div>
</section>

<div id="fade"></div>
<div id="loading"><div class="egg">🥚</div><div>טוען את מערת הדרקונים…</div></div>
<div id="rotate">🔄<br>סובבו את המסך לרוחב</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
